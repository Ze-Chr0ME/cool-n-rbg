[package]
name = "coolrgbd"
version.workspace = true
edition.workspace = true

[features]
default = ["corsair", "evision", "msi"]
# Drivers to build in; see coolrgb-core's features. A slim build: --no-default-features --features corsair
corsair = ["coolrgb-core/corsair", "dep:hidapi"]
evision = ["coolrgb-core/evision", "dep:hidapi"]
msi = ["coolrgb-core/msi"]

[dependencies]
coolrgb-core = { path = "../core", default-features = false }
hidapi = { version = "2", default-features = false, features = ["windows-native"], optional = true }
serde_json = "1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0.12"
